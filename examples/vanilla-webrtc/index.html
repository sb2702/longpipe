<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Longpipe · vanilla WebRTC</title>
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --fg: #1b1b1b; --muted: #6b6b6b; --card: #fff; --line: #ddd; --bad: #b3261e; --ok: #1e7a3c; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #eee; --muted: #9a9a9a; --card: #1e1e1e; --line: #333; --bad: #ff8a80; --ok: #7fd99a; } }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
    h1 { font-size: 18px; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: end; margin-bottom: 12px; }
    label { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); }
    select, input, button { font: inherit; }
    button { padding: 6px 14px; }
    .videos { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
    figure { margin: 0; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
    figcaption { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    video { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 4px; }
    table { border-collapse: collapse; margin-top: 12px; font-variant-numeric: tabular-nums; }
    td { padding: 2px 12px 2px 0; vertical-align: top; }
    td:first-child { color: var(--muted); }
    #lastError { color: var(--bad); }
    #lastError.none { color: var(--ok); }
    #log { margin-top: 12px; max-height: 160px; overflow: auto; font: 12px ui-monospace, monospace; white-space: pre-wrap; color: var(--muted); }
  </style>
</head>
<body>
  <h1>Longpipe → RTCPeerConnection loopback</h1>

  <form class="controls" id="controls" onsubmit="return false">
    <label>Input
      <select name="input">
        <option value="camera">camera + mic</option>
        <option value="clip">test clip + tone/noise</option>
      </select>
    </label>
    <label>Background
      <select name="bg">
        <option value="none">none</option>
        <option value="blur">blur</option>
        <option value="image">image</option>
        <option value="color">solid colour</option>
      </select>
    </label>
    <label>Colour <input name="color" type="color" value="#00ff00" /></label>
    <label>Audio denoise
      <select name="denoise">
        <option value="on">on</option>
        <option value="off">off</option>
      </select>
    </label>
    <label>Backend (restarts)
      <select name="backend">
        <option value="auto">auto</option>
        <option value="webgpu">prefer WebGPU</option>
        <option value="webgl2">force WebGL2</option>
        <option value="none">none (no GPU)</option>
      </select>
    </label>
    <button id="start" type="button">Start</button>
    <button id="stop" type="button" disabled>Stop</button>
    <label><span><input name="listen" type="checkbox" /> hear remote audio</span></label>
  </form>

  <div class="videos">
    <figure><figcaption>Local: <code>pipeline.stream</code></figcaption><video id="local" autoplay playsinline muted></video></figure>
    <figure><figcaption>Remote: what pc2 received</figcaption><video id="remote" autoplay playsinline muted></video></figure>
  </div>

  <table>
    <tbody>
      <tr><td>status</td><td id="r-status">–</td></tr>
      <tr><td>backend</td><td id="r-backend">–</td></tr>
      <tr><td>input fps / output fps</td><td id="r-fps">–</td></tr>
      <tr><td>frames sent / decoded (remote fps)</td><td id="r-frames">–</td></tr>
      <tr><td>audio received</td><td id="r-audio">–</td></tr>
      <tr><td>denoise</td><td id="r-denoise">–</td></tr>
      <tr><td>paths</td><td id="r-paths">–</td></tr>
      <tr><td>restarts</td><td id="r-restarts">–</td></tr>
      <tr><td>last error</td><td id="lastError" class="none">none</td></tr>
    </tbody>
  </table>
  <div id="log"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
